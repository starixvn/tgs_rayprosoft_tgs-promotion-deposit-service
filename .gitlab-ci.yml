include:
  - project: rayprosoft/tgs-ci-scripts
    ref: main
    file: GitLab/Templates/gitlab-job-templates.yml

variables:
  BuildCacheKey: PromotionDepositService.$CI_PIPELINE_IID
  ImageName: pgtgs/promotion-deposit-service
  HelmTemplateFolderName: promotion-deposit-service
  TgsSettingKey: promotion-deposit-service

stages:
  - build
  - test
  - publish
  - deploy-dev
  - deploy-staging
  - deploy-prod

build-code:
  extends: .build-code-template

unit-test:
  extends: .unit-test-template

push-docker-image:
  extends: .push-docker-image-template
  variables:
    project: Tgs.Promotion.Deposit.Service/Tgs.Promotion.Deposit.Service.csproj

push-k8s-template:
  extends: .push-k8s-template

deploy-dev:
  extends: .deploy-template
  variables:
    namespace: dev
    kube_config: KubeConfig_Raypro_dev
    replica: 2
  environment:
    name: dev
  stage: deploy-dev
  needs:
    - push-docker-image
    - job: push-k8s-template
      artifacts: true
  only:
    - main
  when: always

deploy-staging:
  extends: .deploy-template
  variables:
    namespace: staging
    kube_config: KubeConfig_Raypro_staging
    replica: 2
  environment:
    name: staging
  stage: deploy-staging
  needs:
    - deploy-dev
    - job: push-k8s-template
      artifacts: true
  only:
    - main
  when: manual

deploy-prod:
  extends: .deploy-template
  variables:
    namespace: prod
    kube_config: KubeConfig_Raypro_prod
    replica: 2
  environment:
    name: prod
  stage: deploy-prod
  needs:
    - deploy-staging
    - job: push-k8s-template
      artifacts: true
  only:
    - main
  when: manual

