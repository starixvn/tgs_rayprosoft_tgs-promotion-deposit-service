apiVersion: v1
kind: ConfigMap
metadata:
  name: configmap-{{ include "promotion-deposit-service.fullname" . }}
  namespace: {{ .Release.Namespace }}
data:
  appsettings.json: |
    {
      "Promotion": {
        "PaymentServiceUrl": "http://payment-api",
        "Url": "http://promotion-api",
        "CashBaseUrl": "http://cashservice-api",
        "PlayerBucketBaseUrl": "http://tgs-playerbucket-service"
      }
    }
  otel-collector-config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:

    processors:
      batch:

    exporters:
      otlp:
        endpoint: "$NODE_IP:4317"
        tls:
          insecure: true
      prometheus:
        endpoint: "0.0.0.0:8889"
        namespace: "tgs"

    extensions:
      health_check:
        endpoint: 0.0.0.0:13133

    service:
      extensions: [health_check]
      pipelines:
        traces: 
          receivers: [otlp]
          processors:
            - batch
          exporters: [otlp]
        metrics:
          receivers: [otlp]
          exporters: [prometheus]